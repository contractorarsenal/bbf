name = "bbf-demo"
compatibility_date = "2026-09-01"
main = "worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# "demo" = deterministic dev-only fallback engine. Set to "anthropic" (and run
# `npx wrangler secret put ANTHROPIC_API_KEY` — never add the key here in
# plaintext) to enable the real Claude-powered assistant.
AI_PROVIDER = "demo"
